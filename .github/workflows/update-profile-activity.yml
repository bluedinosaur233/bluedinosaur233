name: Update profile activity

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'design/update-activity.py'
      - 'design/test-activity.py'
      - '.github/workflows/update-profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate calendar parser
        run: python3 design/test-activity.py
      - name: Render public contribution calendar
        run: python3 design/update-activity.py
      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-v2/activity.svg assets/profile-v2/activity-mobile.svg assets/profile-v2/activity-static.svg assets/profile-v2/activity-mobile-static.svg assets/profile-v2/activity-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile activity"
          git push
