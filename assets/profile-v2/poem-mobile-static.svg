<svg xmlns="http://www.w3.org/2000/svg" width="600" height="176" viewBox="0 0 600 176" role="img" aria-labelledby="title"><title id="title">醉后不知天在水，满船清梦压星河</title><defs><linearGradient id="poem" gradientUnits="userSpaceOnUse" x1="80" x2="520"><stop stop-color="#4485AC"/><stop offset=".5" stop-color="#847EAE"/><stop offset="1" stop-color="#AE6D94"/></linearGradient></defs><g font-family="Songti SC,STSong,Noto Serif CJK SC,serif" fill="url(#poem)"><text x="147.68" y="75.38" font-size="34" opacity="1">醉</text><text x="185.76" y="75.38" font-size="34" opacity="1">后</text><text x="223.84" y="75.38" font-size="34" opacity="1">不</text><text x="261.92" y="75.38" font-size="34" opacity="1">知</text><text x="300.0" y="75.38" font-size="34" opacity="1">天</text><text x="338.08" y="75.38" font-size="34" opacity="1">在</text><text x="376.16" y="75.38" font-size="34" opacity="1">水</text><text x="414.24" y="75.38" font-size="34" opacity="1">，</text><text x="166.72" y="122.38" font-size="34" opacity="1">满</text><text x="204.8" y="122.38" font-size="34" opacity="1">船</text><text x="242.88" y="122.38" font-size="34" opacity="1">清</text><text x="280.96" y="122.38" font-size="34" opacity="1">梦</text><text x="319.04" y="122.38" font-size="34" opacity="1">压</text><text x="357.12" y="122.38" font-size="34" opacity="1">星</text><text x="395.2" y="122.38" font-size="34" opacity="1">河</text></g></svg>