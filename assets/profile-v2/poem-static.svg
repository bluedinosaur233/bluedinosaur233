<svg xmlns="http://www.w3.org/2000/svg" width="960" height="100" viewBox="0 0 960 100" role="img" aria-labelledby="title"><title id="title">醉后不知天在水，满船清梦压星河</title><defs><linearGradient id="poem" gradientUnits="userSpaceOnUse" x1="80" x2="880"><stop stop-color="#4485AC"/><stop offset=".5" stop-color="#847EAE"/><stop offset="1" stop-color="#AE6D94"/></linearGradient></defs><path d="M20 50h35m850 0h35" stroke="#BECDE0"/><path d="m72 50 4-4 4 4-4 4zm808 0 4-4 4 4-4 4z" fill="#B58FB5"/><g font-family="Songti SC,STSong,Noto Serif CJK SC,serif" fill="url(#poem)"><text x="194.4" y="60.88" font-size="34" opacity="1">醉</text><text x="232.48" y="60.88" font-size="34" opacity="1">后</text><text x="270.56" y="60.88" font-size="34" opacity="1">不</text><text x="308.64" y="60.88" font-size="34" opacity="1">知</text><text x="346.72" y="60.88" font-size="34" opacity="1">天</text><text x="384.8" y="60.88" font-size="34" opacity="1">在</text><text x="422.88" y="60.88" font-size="34" opacity="1">水</text><text x="460.96" y="60.88" font-size="34" opacity="1">，</text><text x="499.04" y="60.88" font-size="34" opacity="1">满</text><text x="537.12" y="60.88" font-size="34" opacity="1">船</text><text x="575.2" y="60.88" font-size="34" opacity="1">清</text><text x="613.28" y="60.88" font-size="34" opacity="1">梦</text><text x="651.36" y="60.88" font-size="34" opacity="1">压</text><text x="689.44" y="60.88" font-size="34" opacity="1">星</text><text x="727.52" y="60.88" font-size="34" opacity="1">河</text></g></svg>